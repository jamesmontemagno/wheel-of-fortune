name: Build and Package iOS

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build and sign a release IPA'
        required: false
        default: false
        type: boolean
      upload_testflight:
        description: 'Upload the signed IPA to TestFlight'
        required: false
        default: false
        type: boolean
      base_version:
        description: 'Application display version (for example, 1.0.0)'
        required: false
        default: '1.0.0'
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: maui-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Required / iOS
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      PROJECT_PATH: mobile/WheelOfWisdom.Maui/WheelOfWisdom.Maui.csproj
      TARGET_FRAMEWORK: net10.0-ios
      RUNTIME_ID: ios-arm64
      APP_IDENTIFIER: com.refractored.wheelofwisdom

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect iOS changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            ios:
              - 'mobile/**'
              - 'index.html'
              - 'public/**'
              - 'src/**'
              - 'wheel-of-wisdom-mobile.slnx'
              - '.github/workflows/maui-ios.yml'

      - name: Validate workflow inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight && !inputs.build_release }}
        run: |
          echo "build_release must be enabled when upload_testflight is enabled" >&2
          exit 1

      - name: Select Xcode
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.ios == 'true' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup .NET SDK
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.ios == 'true' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET workloads
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.ios == 'true' }}
        run: dotnet workload restore "${{ env.PROJECT_PATH }}"

      - name: Restore
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.ios == 'true' }}
        run: dotnet restore "${{ env.PROJECT_PATH }}" -p:TargetFramework="${{ env.TARGET_FRAMEWORK }}"

      - name: Build iOS simulator app
        if: ${{ (github.event_name != 'pull_request' || steps.changes.outputs.ios == 'true') && (github.event_name == 'pull_request' || !inputs.build_release) }}
        run: >-
          dotnet build "${{ env.PROJECT_PATH }}"
          -c Debug
          -f "${{ env.TARGET_FRAMEWORK }}"
          -p:RuntimeIdentifier=iossimulator-arm64

      - name: No relevant changes
        if: ${{ github.event_name == 'pull_request' && steps.changes.outputs.ios != 'true' }}
        run: echo "No relevant iOS changes; check passed."

      - name: Compute release version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        id: version
        env:
          BASE_VERSION: ${{ inputs.base_version }}
        run: |
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "base_version must be a valid version such as 1.0.0" >&2
            exit 1
          fi

          echo "display-version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "app-version=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Validate iOS release secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_IOS_APPSTORE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_APPSTORE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_IOS_APPSTORE_PROFILE }}
          APP_STORE_ISSUER_ID: ${{ secrets.APPLE_REFRACTORED_ISSUER_ID }}
          APP_STORE_KEY_ID: ${{ secrets.APPLE_REFRACTORED_KEY_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APPLE_REFRACTORED_P8_KEY }}
        run: |
          if [ -z "$CERTIFICATE_P12" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$PROVISIONING_PROFILE" ]; then
            echo "The iOS distribution certificate, password, and provisioning profile secrets are required" >&2
            exit 1
          fi

          if [ "${{ inputs.upload_testflight }}" = "true" ] && { [ -z "$APP_STORE_ISSUER_ID" ] || [ -z "$APP_STORE_KEY_ID" ] || [ -z "$APP_STORE_PRIVATE_KEY" ]; }; then
            echo "The App Store Connect API secrets are required to upload to TestFlight" >&2
            exit 1
          fi

      - name: Import signing certificate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          create-keychain: true
          keychain-password: ${{ secrets.APPLE_IOS_APPSTORE_CERTIFICATE_PASSWORD }}
          p12-file-base64: ${{ secrets.APPLE_IOS_APPSTORE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_IOS_APPSTORE_CERTIFICATE_PASSWORD }}

      - name: Locate signing identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        id: signing-identity
        run: |
          keychain="$HOME/Library/Keychains/signing_temp.keychain-db"
          if [ ! -f "$keychain" ]; then
            keychain="$HOME/Library/Keychains/signing_temp.keychain"
          fi
          if [ ! -f "$keychain" ]; then
            # Fall back to the keychains currently on the search list.
            keychain=""
          fi

          # "-v" only lists identities that pass validation, which hides the imported
          # certificate when its intermediate is unavailable, so fall back to every identity.
          for verify_flag in "-v" ""; do
            identities=$(security find-identity $verify_flag -p codesigning ${keychain:+"$keychain"} || true)

            echo "Available code signing identities (find-identity $verify_flag):"
            printf '%s\n' "$identities"

            signing_identity=$(printf '%s\n' "$identities" |
              grep -Eo '"(Apple|iPhone) Distribution: [^"]+"' |
              head -n 1 |
              tr -d '"')

            if [ -n "$signing_identity" ]; then
              break
            fi
          done

          if [ -z "$signing_identity" ]; then
            echo "No Apple Distribution or iPhone Distribution signing identity was found in the keychain" >&2
            exit 1
          fi

          echo "Using signing identity: $signing_identity"

          echo "name=$signing_identity" >> "$GITHUB_OUTPUT"

      - name: Install provisioning profile
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        id: provisioning-profile
        env:
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.APPLE_IOS_APPSTORE_PROFILE }}
        run: |
          if [ -z "$IOS_APPSTORE_PROFILE_BASE64" ]; then
            echo "APPLE_IOS_APPSTORE_PROFILE secret is required for a release build" >&2
            exit 1
          fi

          profile_path="${{ runner.temp }}/wheelofwisdom.mobileprovision"
          profile_plist="${{ runner.temp }}/wheelofwisdom-profile.plist"
          profiles_directory="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")
          profile_app_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")

          if [[ "$profile_app_identifier" != *."${{ env.APP_IDENTIFIER }}" ]]; then
            echo "Provisioning profile '$profile_name' is for '$profile_app_identifier', not '${{ env.APP_IDENTIFIER }}'" >&2
            exit 1
          fi

          mkdir -p "$profiles_directory"
          cp "$profile_path" "$profiles_directory/$profile_uuid.mobileprovision"
          echo "uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "name=$profile_name" >> "$GITHUB_OUTPUT"

      - name: Publish signed iOS archive
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" \
            -c Release \
            -f "${{ env.TARGET_FRAMEWORK }}" \
            -p:ArchiveOnBuild=true \
            -p:BuildIpa=true \
            -p:RuntimeIdentifier="${{ env.RUNTIME_ID }}" \
            -p:ApplicationId="${{ env.APP_IDENTIFIER }}" \
            -p:ApplicationDisplayVersion="${{ steps.version.outputs.display-version }}" \
            -p:ApplicationVersion="${{ steps.version.outputs.app-version }}" \
            -p:CodesignKey="${{ steps.signing-identity.outputs.name }}" \
            -p:CodesignProvision="${{ steps.provisioning-profile.outputs.name }}"

      - name: Locate iOS archive
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        id: ios-artifact
        run: |
          artifact_path=$(find "mobile/WheelOfWisdom.Maui/bin/Release/${{ env.TARGET_FRAMEWORK }}/${{ env.RUNTIME_ID }}/publish" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$artifact_path" ]; then
            echo "Signed iOS archive was not produced" >&2
            exit 1
          fi

          echo "path=$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && inputs.upload_testflight }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-type: ios
          app-path: ${{ steps.ios-artifact.outputs.path }}
          issuer-id: ${{ secrets.APPLE_REFRACTORED_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_REFRACTORED_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_REFRACTORED_P8_KEY }}

      - name: Upload iOS archive
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        uses: actions/upload-artifact@v7
        with:
          name: wheel-of-wisdom-ios-ipa
          path: ${{ steps.ios-artifact.outputs.path }}
          if-no-files-found: error
